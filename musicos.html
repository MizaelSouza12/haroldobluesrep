<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Repertório para Músicos</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0b0d;--line:#29292d;--fg:#f5f5f7;--muted:#98989f;--accent:#ff453a;--artist:#ffd60a}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    main{width:min(820px,100%);margin:0 auto;padding:26px 18px 48px}
    header{padding:4px 2px 22px;border-bottom:1px solid var(--line)}
    .eyebrow{margin:0 0 7px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(24px,6vw,38px);line-height:1.08;letter-spacing:-.02em}
    .meta{margin-top:9px;color:var(--muted);font-size:14px}
    #list{margin-top:12px}
    .song{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line)}
    .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;text-align:right}
    .title{font-size:17px;font-weight:760;line-height:1.25;overflow-wrap:anywhere}
    .artist{margin-top:4px;color:var(--artist);font-size:13px;line-height:1.25;overflow-wrap:anywhere}
    .key{min-width:58px;padding:8px 10px;border-radius:10px;background:#222226;border:1px solid #38383d;text-align:center;font-size:17px;font-weight:850;white-space:nowrap}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    button{appearance:none;border:0;border-radius:11px;padding:12px 15px;background:#26262a;color:var(--fg);font:inherit;font-size:14px;font-weight:750;cursor:pointer}
    button.primary{background:var(--accent);color:white}
    #error{display:none;margin:30px 0;padding:18px;border:1px solid #4a2727;border-radius:14px;background:#1c1112;color:#ffb4ae;line-height:1.45}
    footer{margin-top:30px;color:#696970;font-size:11px;text-align:center}
    @media(max-width:520px){main{padding-left:13px;padding-right:13px}.song{grid-template-columns:34px minmax(0,1fr) auto;gap:9px}.title{font-size:16px}.key{min-width:50px;font-size:16px;padding:7px 8px}}
    @media print{body{background:white;color:#111}main{width:100%;padding:0}.eyebrow{color:#111}.meta,.num{color:#555}.artist{color:#333}.key{background:white;border:1px solid #aaa}.actions,footer{display:none}.song{break-inside:avoid;border-color:#ddd}header{border-color:#bbb}}
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Repertório para músicos</p>
      <h1 id="title">Repertório</h1>
      <div class="meta" id="meta">Carregando…</div>
    </header>
    <div id="error" role="alert"></div>
    <section id="list" aria-label="Lista de músicas"></section>
    <div class="actions" id="actions" hidden>
      <button class="primary" id="copyBtn" type="button">Copiar lista</button>
      <button id="printBtn" type="button">Imprimir / PDF</button>
    </div>
    <footer>Este link contém somente música, artista e nota.</footer>
  </main>
  <script>
    'use strict';
    const MAX_SONGS=300,MAX_NAME=120,MAX_FIELD=220;
    function decodeBase64Url(value){
      const clean=String(value||'').replace(/-/g,'+').replace(/_/g,'/');
      const padded=clean+'='.repeat((4-clean.length%4)%4);
      const binary=atob(padded),bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
    }
    function validText(v,max){return typeof v==='string'&&v.length<=max}
    function readPayload(){
      const match=location.hash.match(/^#d=([A-Za-z0-9_-]+)$/);
      if(!match)throw new Error('Link de repertório inválido ou incompleto.');
      let data;
      try{data=JSON.parse(decodeBase64Url(match[1]));}
      catch(e){throw new Error('Não foi possível abrir este repertório. Peça ao artista para gerar um novo link.');}
      if(!data||data.v!==1||!validText(data.n,MAX_NAME)||!Array.isArray(data.s)||data.s.length>MAX_SONGS)throw new Error('Este repertório está em um formato inválido.');
      const songs=data.s.map(row=>{
        if(!Array.isArray(row)||row.length<3||!validText(row[0],MAX_FIELD)||!validText(row[1],MAX_FIELD)||!validText(row[2],40))throw new Error('O repertório contém dados inválidos.');
        return{title:row[0].trim(),artist:row[1].trim(),key:row[2].trim()};
      });
      return{name:data.n.trim()||'Repertório',songs};
    }
    function addText(parent,className,value){
      const el=document.createElement('div');el.className=className;el.textContent=value;parent.appendChild(el);return el;
    }
    function render(data){
      document.title=data.name+' — Repertório';
      document.getElementById('title').textContent=data.name;
      document.getElementById('meta').textContent=data.songs.length+(data.songs.length===1?' música':' músicas');
      const list=document.getElementById('list');list.textContent='';
      data.songs.forEach((song,index)=>{
        const row=document.createElement('article');row.className='song';
        addText(row,'num',String(index+1).padStart(2,'0'));
        const info=document.createElement('div');
        addText(info,'title',song.title||'Sem título');
        addText(info,'artist',song.artist||'Artista não informado');
        row.appendChild(info);addText(row,'key',song.key||'___');list.appendChild(row);
      });
      document.getElementById('actions').hidden=false;
      document.getElementById('copyBtn').onclick=async()=>{
        const lines=['REPERTÓRIO - '+data.name,''];
        data.songs.forEach((s,i)=>lines.push(String(i+1).padStart(2,'0')+'. '+s.title+' - '+s.artist+' - '+(s.key||'___')));
        const value=lines.join('\n');
        try{await navigator.clipboard.writeText(value);alert('Lista copiada.');}
        catch(e){prompt('Copie a lista abaixo:',value);}
      };
      document.getElementById('printBtn').onclick=()=>window.print();
    }
    try{render(readPayload());}
    catch(err){
      document.getElementById('meta').textContent='Não foi possível carregar';
      const box=document.getElementById('error');box.textContent=err&&err.message?err.message:'Link inválido.';box.style.display='block';
    }
  </script>
</body>
</html>
